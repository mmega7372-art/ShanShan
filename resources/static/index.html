<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ရှမ်းကိုးမီး မျက်နှာချင်းဆိုင်</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Padauk', sans-serif; 
            background: #0f380f; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .board { 
            width: 100%;
            max-width: 480px; 
            background: #1e5e1e; 
            border: 3px solid #ffd700; 
            border-radius: 12px; 
            padding: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.5); 
            margin: auto;
        }

        h2 { font-size: 20px; margin: 8px 0; }
        h4 { font-size: 16px; margin: 5px 0; }
        h5 { font-size: 14px; }

        /* Setup Inputs */
        input[type="text"] {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        
        /* Player Sections */
        .player-box { background: rgba(0, 0, 0, 0.25); border-radius: 8px; padding: 8px; margin: 6px 0; border: 2px dashed #2ecc71; }
        .opponent-box { border-color: #e74c3c; }

        /* Card Styles optimized for iPhone Pro Max screens */
        .card { 
            display: inline-block; 
            width: 50px; 
            height: 75px; 
            background: #fff; 
            color: #000; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold; 
            margin: 3px; 
            line-height: 75px; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.3); 
            text-align: center;
        }
        .card-back { background: #2980b9; color: #fff; font-size: 20px; line-height: 75px; }
        .red { color: red; }

        /* Center Table */
        .center-table { 
            background: #144614; 
            border: 1.5px solid #ffd700; 
            border-radius: 8px; 
            padding: 6px; 
            margin: 8px 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
        }
        .deck-pile { width: 40px; height: 60px; background: #c0392b; border: 1.5px solid #fff; border-radius: 4px; line-height: 60px; font-size: 18px; font-weight: bold; }

        /* Buttons & Touch Optimization (Min 44px height for iOS touch targets) */
        .btn { 
            background: #ffd700; 
            color: #000; 
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin: 6px 4px; 
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.7; }
        
        .status { font-size: 15px; margin: 4px 0; color: #ffeb3b; }
        .result-box { background: #ffd700; color: #000; font-size: 18px; font-weight: bold; padding: 10px; border-radius: 8px; margin-top: 8px; }
        #error-log { color: #ff6b6b; font-weight: bold; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="board">
    <h2>♠️ ရှမ်းကိုးမီး မျက်နှာချင်းဆိုင် ♣️</h2>

    <!-- Connection / Room Setup -->
    <div id="setup-panel">
        <input type="text" id="playerName" placeholder="သင့်အမည် ထည့်ပါ"><br>
        <input type="text" id="roomId" placeholder="အခန်းနံပါတ် (ဥပမာ - 123)"><br>
        <button class="btn" onclick="connect()">အခန်းသို့ ဝင်မည်</button>
        <div id="
