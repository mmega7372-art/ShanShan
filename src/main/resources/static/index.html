<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ရှမ်းကိုးမီး မျက်နှာချင်းဆိုင်</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Padauk', sans-serif; 
            background: #0f380f; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .board { 
            width: 100%;
            max-width: 480px; 
            background: #1e5e1e; 
            border: 3px solid #ffd700; 
            border-radius: 12px; 
            padding: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.5); 
            margin: auto;
        }

        h2 { font-size: 20px; margin: 8px 0; }
        h4 { font-size: 16px; margin: 5px 0; }
        h5 { font-size: 14px; }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        
        .player-box { background: rgba(0, 0, 0, 0.25); border-radius: 8px; padding: 8px; margin: 6px 0; border: 2px dashed #2ecc71; }
        .opponent-box { border-color: #e74c3c; }

        .card { 
            display: inline-block; 
            width: 50px; 
            height: 75px; 
            background: #fff; 
            color: #000; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold; 
            margin: 3px; 
            line-height: 75px; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.3); 
            text-align: center;
            user-select: none;
        }
        .card-back { background: #2980b9; color: #fff; font-size: 20px; line-height: 75px; cursor: pointer; }
        .red { color: red; }

        .center-table { 
            background: #144614; 
            border: 1.5px solid #ffd700; 
            border-radius: 8px; 
            padding: 6px; 
            margin: 8px 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
        }
        .deck-pile { 
            width: 45px; 
            height: 65px; 
            background: #c0392b; 
            border: 2px solid #fff; 
            border-radius: 5px; 
            line-height: 65px; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .deck-pile:active { transform: scale(0.95); }

        .btn { 
            background: #ffd700; 
            color: #000; 
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin: 6px 4px; 
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.7; }
        
        .status { font-size: 15px; margin: 4px 0; color: #ffeb3b; }
        .result-box { background: #ffd700; color: #000; font-size: 18px; font-weight: bold; padding: 10px; border-radius: 8px; margin-top: 8px; }
        #error-log { color: #ff6b6b; font-weight: bold; margin-top: 8px; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="board">
    <h2>♠️ ရှမ်းကိုးမီး  ♣️</h2>

    <!-- Setup Panel -->
    <div id="setup-panel">
        <input type="text" id="playerName" placeholder="သင့်အမည် ထည့်ပါ"><br>
        <input type="text" id="roomId" placeholder="အခန်းနံပါတ် (ဥပမာ - 123)"><br>
        <button class="btn" onclick="connect()">အခန်းသို့ ဝင်မည်</button>
        <div id="error-log"></div>
    </div>

    <!-- Game Panel -->
    <div id="game-panel" class="hidden">
        <div class="status" id="room-display">အခန်း: -</div>
        
        <!-- Opponent Box -->
        <div class="player-box opponent-box">
            <h4 id="opponent-name">ပြိုင်ဘက်</h4>
            <div id="opponent-cards">
                <div class="card card-back">?</div>
                <div class="card card-back">?</div>
            </div>
            <div id="opponent-info">အမှတ်: -</div>
        </div>

        <!-- Center Table -->
        <div class="center-table">
            <div class="deck-pile" onclick="drawCard()" title="ကဒ်ဆွဲရန် နှိပ်ပါ">🂠</div>
            <div>
                <div id="game-status" style="font-size: 13px; color: #ffd700;">(ကဒ်ဆွဲရန် အလယ်ဖဲကိုနှိပ်ပါ)</div>
            </div>
        </div>

        <!-- My Box -->
        <div class="player-box">
            <h4 id="my-name">ကျွန်ုပ်</h4>
            <div id="my-cards"></div>
            <div id="my-info">အမှတ်: -</div>
        </div>

        <!-- Action Buttons -->
        <div id="action-buttons">
            <button class="btn btn-danger" id="stand-btn" onclick="standGame()">ရပ်မည် (Stand)</button>
        </div>

        <div id="result-container" class="result-box hidden"></div>
        <button class="btn hidden" id="restart-btn" onclick="restartGame()">ပွဲသစ်စရန်</button>
    </div>
</div>

<script>
    let stompClient = null;
    let playerName = "";
    let roomId = "";
    
    // ဖွင့်ပြီးသား ကဒ်တွေရဲ့ Index များကို မှတ်ထားရန် Set တစ်ခု သုံးမည်
    let revealedCards = new Set();
    let lastHandSignature = "";

    function connect() {
        playerName = document.getElementById('playerName').value.trim();
        roomId = document.getElementById('roomId').value.trim();
        const errorLog = document.getElementById('error-log');

        if (!playerName || !roomId) {
            errorLog.innerText = "ကျေးဇူးပြု၍ အမည်နှင့် အခန်းနံပါတ် ဖြည့်ပါ။";
            return;
        }
        errorLog.innerText = "";

        const socket = new SockJS('/ws-game');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; 

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            
            stompClient.subscribe('/topic/room/' + roomId, function (response) {
                showGameState(JSON.parse(response.body));
            });

            stompClient.send("/app/game.action", {}, JSON.stringify({
                type: "JOIN",
                roomId: roomId,
                playerName: playerName
            }));

            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('game-panel').classList.remove('hidden');
            document.getElementById('room-display').innerText = "အခန်းနံပါတ်: " + roomId;

        }, function (error) {
            console.error('STOMP error:', error);
            errorLog.innerText = "ချိတ်ဆက်မှု မအောင်မြင်ပါ။ ထပ်ကြိုးစားပါ။";
        });
    }

    function drawCard() {
        stompClient.send("/app/game.action", {}, JSON.stringify({
            type: "DRAW",
            roomId: roomId,
            playerName: playerName
        }));
    }

    function standGame() {
        stompClient.send("/app/game.action", {}, JSON.stringify({
            type: "STAND",
            roomId: roomId,
            playerName: playerName
        }));
    }

    function restartGame() {
        // ပွဲသစ်စလျှင် ဖွင့်ထားတဲ့ ကဒ် မှတ်ဉာဏ်များကို ရှင်းလင်းပေးမည်
        revealedCards.clear();
        lastHandSignature = "";
        stompClient.send("/app/game.action", {}, JSON.stringify({
            type: "START",
            roomId: roomId,
            playerName: playerName
        }));
    }

    function flipCard(element, index, cardText, isRed) {
        revealedCards.add(index); // ဤကဒ်ကို ဖွင့်ပြီးကြောင်း မှတ်သားမည်
        element.innerText = cardText;
        element.classList.remove('card-back');
        if (isRed) element.classList.add('red');
        element.style.background = "#fff";
        element.removeAttribute('onclick'); // ထပ်နှိပ်၍မရတော့အောင် ဖြုတ်မည်
    }

    function showGameState(data) {
        const state = data.state;
        const players = state.players;
        
        document.getElementById('room-display').innerText = "အခန်း: " + roomId + " | အခြေအနေ: " + (state.status === "FINISHED" ? "ပွဲပြီးပါပြီ" : "ကစားနေဆဲ");

        let myCardsHtml = "";
        let oppCardsHtml = "";
        let myScoreText = "-";
        let oppScoreText = "-";
        let opponentNameDisplay = "ပြိုင်ဘက်";

        for (let [name, pData] of Object.entries(players)) {
            let cardsHtml = "";
            let cardCount = pData.cards.length;

            // ဖဲအသစ်စဝေချိန် (ကဒ်အရေအတွက်ပြောင်းသွားလျှင်) ဖွင့်ထားသော မှတ်ဉာဏ်ကို အလိုအလျောက် စီမံမည်
            let handSig = pData.cards.map(c => c.suit + c.value).join(',');
            if (name === playerName && handSig !== lastHandSignature) {
                // အကယ်၍ ပွဲအသစ်စခြင်း (ကဒ် ၂ ကဒ်) ဖြစ်လျှင် Revealed ကို ရှင်းမည်
                if (cardCount === 2 && lastHandSignature !== "") {
                    revealedCards.clear();
                }
                lastHandSignature = handSig;
            }

            pData.cards.forEach((card, index) => {
                let isRed = (card.suit === '♥' || card.suit === '♦');
                let colorClass = isRed ? "card red" : "card";
                let valStr = card.value === 1 ? 'A' : (card.value === 11 ? 'J' : (card.value === 12 ? 'Q' : (card.value === 13 ? 'K' : card.value)));
                
                if (name === playerName) {
                    // အကယ်၍ ဒီကဒ်ကို အရင်က ဖွင့်ထားပြီးသား ဖြစ်လျှင် (သို့မဟုတ် ပွဲပြီးသွားလျှင်) ပွင့်လျက်သား ပြမယ်
                    if (revealedCards.has(index) || state.status === "FINISHED") {
                        cardsHtml += `<div class="${colorClass}">${valStr}${card.suit}</div>`;
                    } else {
                        // မဖွင့်ရသေးသော ကဒ်များ (အစပိုင်း ၂ ကဒ် နှင့် ဆွဲထားသော တတိယကဒ်)
                        cardsHtml += `<div class="card card-back" onclick="flipCard(this, ${index}, '${valStr}${card.suit}', ${isRed})">🂠</div>`;
                    }
                } else {
                    opponentNameDisplay = name;
                    if (state.status === "FINISHED") {
                        cardsHtml += `<div class="${colorClass}">${valStr}${card.suit}</div>`;
                    } else {
                        if (cardCount === 3 && index === 2) {
                            cardsHtml += `<div class="card card-back" style="background:#2980b9; color:#fff;">၃ကဒ်</div>`;
                        } else {
                            cardsHtml += `<div class="card card-back">?</div>`;
                        }
                    }
                }
            });

            if (name === playerName) {
                myCardsHtml = cardsHtml;
                myScoreText = `အမှတ်: ${pData.score} (: ${pData.multiplier}x) ${pData.ready ? '✓ (ရပ်ပြီး)' : ''}`;
                document.getElementById('my-name').innerText = name + " (သင်)";
            } else {
                oppCardsHtml = cardsHtml;
                oppScoreText = state.status === "FINISHED" ? `အမှတ်: ${pData.score} (: ${pData.multiplier}x)` : `ကဒ်အရေအတွက်: ${cardCount} ကဒ်`;
            }
        }

        document.getElementById('my-cards').innerHTML = myCardsHtml;
        document.getElementById('my-info').innerText = myScoreText;
        document.getElementById('opponent-name').innerText = opponentNameDisplay;
        document.getElementById('opponent-cards').innerHTML = oppCardsHtml;
        document.getElementById('opponent-info').innerText = oppScoreText;

        const resultContainer = document.getElementById('result-container');
        const restartBtn = document.getElementById('restart-btn');
        const actionButtons = document.getElementById('action-buttons');

        if (state.status === "FINISHED") {
            actionButtons.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            restartBtn.classList.remove('hidden');

            if (state.winner) {
                resultContainer.innerText = state.winner === playerName ? "🎉 ဂုဏ်ယူပါတယ်! သင် နိုင်သွားပါပြီ! 🎉" : `🏆 အနိုင်ရရှိသူ: ${state.winner}`;
            } else {
                resultContainer.innerText = "🤝 သရေကျပါသည်!";
            }
        } else {
            actionButtons.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            restartBtn.classList.add('hidden');
        }
    }
</script>

</body>
</html>
