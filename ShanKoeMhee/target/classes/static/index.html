<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ရှမ်းကိုးမီး Online - Face to Face</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: 'Padauk', sans-serif; background: #0f380f; color: #fff; text-align: center; margin: 0; padding: 10px; }
        .board { max-width: 650px; margin: 0 auto; background: #1e5e1e; border: 4px solid #ffd700; border-radius: 15px; padding: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        
        /* Player Sections */
        .player-box { background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 10px; margin: 8px 0; border: 2px dashed #2ecc71; }
        .opponent-box { border-color: #e74c3c; }

        /* Card Styles */
        .card { display: inline-block; width: 55px; height: 85px; background: #fff; color: #000; border-radius: 6px; font-size: 18px; font-weight: bold; margin: 4px; line-height: 85px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .card-back { background: #2980b9; color: #fff; font-size: 24px; line-height: 85px; }
        .red { color: red; }

        /* Center Table */
        .center-table { background: #144614; border: 2px solid #ffd700; border-radius: 10px; padding: 10px; margin: 10px 0; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .deck-pile { width: 50px; height: 75px; background: #c0392b; border: 2px solid #fff; border-radius: 5px; line-height: 75px; font-size: 22px; font-weight: bold; }

        /* Buttons & Status */
        .btn { background: #ffd700; color: #000; font-size: 16px; font-weight: bold; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin: 4px; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        .status { font-size: 16px; margin: 5px 0; color: #ffeb3b; }
        .result-box { background: #ffd700; color: #000; font-size: 20px; font-weight: bold; padding: 12px; border-radius: 10px; margin-top: 10px; }
        #error-log { color: #ff6b6b; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="board">
    <h2>♠️ ရှမ်းကိုးမီး ♣️</h2>

    <!-- Connection / Room Setup -->
    <div id="setup-panel">
        <input type="text" id="playerName" placeholder="သင့်အမည် ထည့်ပါ" style="padding: 10px; font-size: 16px;"><br><br>
        <input type="text" id="roomId" placeholder="အခန်းနံပါတ် (ဥပမာ - 123)" style="padding: 10px; font-size: 16px;"><br><br>
        <button class="btn" onclick="connect()">အခန်းသို့ ဝင်မည်</button>
        <div id="error-log"></div>
    </div>

    <!-- Play Area -->
    <div id="game-panel" style="display:none;">
        <h4 id="room-title" style="margin: 5px 0; color: #f1c40f;"></h4>

        <!-- 1. OPPONENT SECTION (Top) -->
        <div class="player-box opponent-box">
            <h5 id="opp-name" style="margin: 0 0 5px 0; color: #ff7675;">ပြိုင်ဖက် (Opponent)</h5>
            <div id="opp-cards"></div>
            <p id="opp-score" class="status">ရမှတ်: စောင့်ဆိုင်းနေပါသည်...</p>
        </div>

        <!-- 2. CENTER TABLE (Middle Deck) -->
        <div class="center-table">
            <div class="deck-pile">🂠</div>
            <div>
                <p style="margin: 0; font-size: 14px; color: #bdc3c7;">ဗဟိုဖဲပုံ (Table Deck)</p>
                <p id="game-status-text" style="margin: 3px 0; font-weight: bold; color: #00e676;">ကစားပွဲ စတင်နေပါပြီ</p>
            </div>
        </div>

        <!-- 3. MY SECTION (Bottom) -->
        <div class="player-box">
            <h5 id="my-name-display" style="margin: 0 0 5px 0; color: #55efc4;">သင့်ဖဲချပ်များ (Your Cards)</h5>
            <div id="my-cards"></div>
            <p id="my-score" class="status">ရမှတ်: -</p>
        </div>

        <!-- Action Controls -->
        <div>
            <button id="btn-draw" class="btn" onclick="drawCard()">ဖဲ ၁ ချပ် ဆွဲမည်</button>
            <button id="btn-stand" class="btn btn-danger" onclick="stand()">မဆွဲတော့ပါ (Stand)</button>
        </div>

        <!-- Winner Result Area -->
        <div id="result-area" class="result-box" style="display:none;">
            <p id="result-text" style="margin: 0 0 10px 0;"></p>
            <button class="btn btn-success" onclick="playAgain()">နောက်တစ်ပွဲ ထပ်ဆော့မည်</button>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let playerName = "";
    let roomId = "";

    function connect() {
        playerName = document.getElementById('playerName').value.trim();
        roomId = document.getElementById('roomId').value.trim();
        const errorLog = document.getElementById('error-log');

        if (!playerName || !roomId) {
            errorLog.innerText = "ကျေးဇူးပြု၍ အမည်နှင့် အခန်းနံပါတ် ဖြည့်ပါ။";
            return;
        }

        errorLog.innerText = "ချိတ်ဆက်နေပါသည်...";

        const socket = new SockJS('/ws-game');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            document.getElementById('room-title').innerText = "အခန်းနံပါတ်: " + roomId;

            stompClient.subscribe('/topic/room/' + roomId, function (gameResponse) {
                renderGame(JSON.parse(gameResponse.body));
            });

            stompClient.send("/app/game.action", {}, JSON.stringify({ type: 'START', playerName: playerName, roomId: roomId }));
        }, function(error) {
            errorLog.innerText = "ချိတ်ဆက်မှု မအောင်မြင်ပါ: " + error;
        });
    }

    function drawCard() {
        stompClient.send("/app/game.action", {}, JSON.stringify({ type: 'DRAW', playerName: playerName, roomId: roomId }));
    }

    function stand() {
        stompClient.send("/app/game.action", {}, JSON.stringify({ type: 'STAND', playerName: playerName, roomId: roomId }));
    }

    function playAgain() {
        stompClient.send("/app/game.action", {}, JSON.stringify({ type: 'START', playerName: playerName, roomId: roomId }));
    }

    function renderGame(state) {
        let gameState = state.state ? state.state : state;
        let players = gameState.players;
        let isFinished = gameState.status === "FINISHED";

        // Find opponent name (any player whose name is not current user)
        let playerNames = Object.keys(players);
        let opponentName = playerNames.find(name => name !== playerName);

        // 1. Render My Area (Bottom)
        if (players[playerName]) {
            let myData = players[playerName];
            document.getElementById('my-cards').innerHTML = myData.cards.map(c => 
                `<div class="card ${['♥','♦'].includes(c.suit)?'red':''}">${c.value}${c.suit}</div>`
            ).join('');
            
            let scoreText = myData.score === 9 ? "ကိုးမီး !!!" : (myData.score === 8 ? "ရှစ်မီး !" : myData.score + " မှတ်");
            document.getElementById('my-score').innerText = "ရမှတ်: " + scoreText;
            document.getElementById('my-name-display').innerText = "သင့်ဖဲချပ်များ (" + playerName + ")";
        }

        // 2. Render Opponent Area (Top) - Hide cards unless game finished
        let oppCardsDiv = document.getElementById('opp-cards');
        let oppScoreP = document.getElementById('opp-score');
        let oppNameH5 = document.getElementById('opp-name');

        if (opponentName && players[opponentName]) {
            let oppData = players[opponentName];
            oppNameH5.innerText = "ပြိုင်ဖက်: " + opponentName;

            if (isFinished) {
                // Show opponent cards when game is finished
                oppCardsDiv.innerHTML = oppData.cards.map(c => 
                    `<div class="card ${['♥','♦'].includes(c.suit)?'red':''}">${c.value}${c.suit}</div>`
                ).join('');
                let oppScoreText = oppData.score === 9 ? "ကိုးမီး !!!" : (oppData.score === 8 ? "ရှစ်မီး !" : oppData.score + " မှတ်");
                oppScoreP.innerText = "ရမှတ်: " + oppScoreText;
            } else {
                // Hide opponent cards during gameplay
                oppCardsDiv.innerHTML = oppData.cards.map(() => 
                    `<div class="card card-back">🂠</div>`
                ).join('');
                oppScoreP.innerText = "ရမှတ်: ❓ (ဖုံးထားသည်)";
            }
        } else {
            oppNameH5.innerText = "ပြိုင်ဖက် (Opponent)";
            oppCardsDiv.innerHTML = '<p style="color: #f39c12; margin: 5px;">ဒုတိယကစားသမား ဝင်လာရန် စောင့်ဆိုင်းနေပါသည်...</p>';
            oppScoreP.innerText = "";
        }

        // 3. Controls & Winner Results
        let resultArea = document.getElementById('result-area');
        let btnDraw = document.getElementById('btn-draw');
        let btnStand = document.getElementById('btn-stand');
        let resultText = document.getElementById('result-text');
        let statusText = document.getElementById('game-status-text');

        if (isFinished) {
            btnDraw.disabled = true;
            btnStand.disabled = true;
            resultArea.style.display = 'block';
            statusText.innerText = "ပွဲပြီးဆုံးပါပြီ!";

            if (gameState.winner === playerName) {
                resultText.innerText = "🎉 ဂုဏ်ယူပါတယ်! သင် အနိုင်ရရှိပါသည် (" + gameState.winner + ")";
            } else if (gameState.winner) {
                resultText.innerText = "❌ အရေးနိမ့်ပါသည်။ အနိုင်ရသူ: " + gameState.winner;
            } else {
                resultText.innerText = "🤝 သရေကျပါသည်။";
            }
        } else {
            btnDraw.disabled = false;
            btnStand.disabled = false;
            resultArea.style.display = 'none';
            statusText.innerText = "ကစားပွဲ ဆက်လက်သွားနေသည်...";
        }
    }
</script>
</body>
</html>
